<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Server</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>ESP32 Server</h2>
    <p>Temperature: <b id="temp">--</b> &deg;C</p>
    <p>Humidity: <b id="hum">--</b> %</p>
    <div style="margin-top:1.5em;">
      <a href="plots.html" style="color:#6cf;font-weight:bold;">View Temperature Plot</a>
    </div>

    <div id="chat">
      <h3>Chat</h3>
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-form">
        <div><input id="chat-name" type="text" placeholder="Your name" autocomplete="username"></div>
        <div><textarea id="chat-message" type="text" placeholder="Type a message"></textarea></div>
        <div><button id="chat-send">Send</button></div>
      </div>
    </div>

  </div>
  <script src="scripts.js"></script>
</body>
</html>
